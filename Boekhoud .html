  var h = '<div style="max-width:380px;margin:80px auto;padding:0 16px;text-align:center;">';
  h += '<div style="font-size:20px;font-weight:800;margin-bottom:10px;color:var(--navy);">Bijna klaar</div>';
  h += '<div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">We hebben een bevestigingsmail gestuurd. Klik op de link daarin om je e-mailadres te bevestigen, log daarna in &mdash; je eigen bedrijfsadministratie wordt dan automatisch voor je klaargezet.</div>';
  h += '<span style="color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline;" onclick="state.authScreen=\'login\';render();">Terug naar inloggen</span>';
  h += '</div>';
  return h;
}
function submitNieuwBedrijf() {
  var naam = document.getElementById("nb-naam").value.trim();
  var email = document.getElementById("nb-email").value.trim();
  var pass = document.getElementById("nb-pass").value;
  if (!naam || !email || !pass) { state.authError = "Vul bedrijfsnaam, e-mailadres en wachtwoord in."; render(); return; }
  if (!supabaseClient) { state.authError = "Kon geen verbinding maken. Probeer het later opnieuw."; render(); return; }
  state.authBusy = true; state.authError = ""; render();
  supabaseClient.auth.signUp({ email: email, password: pass, options: { data: { bedrijfsnaam: naam } } }).then(function(res){
    state.authBusy = false;
    if (res.error) { state.authError = res.error.message; render(); return; }
    // Altijd met een schone lei beginnen, ook als dit toestel al lokale gegevens van een ander bedrijf/account had
    state.klanten = []; state.producten = []; state.projectenCRM = []; state.facturen = []; state.offertes = [];
    state.uitgaven = []; state.sjablonen = []; state.registraties = [];
    state.bedrijf = emptyBedrijf(); state.bedrijf.naam = naam;
    state.nieuweBedrijfsnaam = naam;
    if (res.data && res.data.session) {
      // E-mailbevestiging staat uit: meteen ingelogd
      state.user = res.data.session.user;
      naLogin();
    } else {
      state.authScreen = "nieuw-bedrijf-verstuurd";
      render();
    }
  });
}
function renderConnectieFout() {
  var h = '<div style="max-width:380px;margin:80px auto;padding:0 16px;text-align:center;">';
  h += '<div style="font-size:20px;font-weight:800;margin-bottom:10px;color:var(--red);">Kan niet verbinden</div>';
  h += '<div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">De beveiligde inlogverbinding kon niet worden geladen. Zonder deze verbinding kan niemand inloggen, dus de app blijft uit voorzorg op slot.</div>';
  h += '<button class="btn-primary" style="width:auto;padding:11px 20px;" onclick="location.reload()">Opnieuw proberen</button>';
  h += '</div>';
  return h;
}
function renderToegangAanvraagForm() {
  var h = '<div style="max-width:380px;margin:60px auto;padding:0 16px;">';
  h += '<div style="font-size:20px;font-weight:800;text-align:center;margin-bottom:4px;color:var(--navy);">Toegang aanvragen</div>';
  h += '<div style="font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:20px;">Vul je gegevens in. De beheerder beoordeelt je aanvraag en geeft daarna toegang.</div>';
  if (state.authError) h += '<div class="alert-box">' + esc(state.authError) + '</div>';
  h += '<div class="section-card">';
  h += '<label class="fl">Naam</label><input class="f" id="aanvraag-naam" />';
  h += '<label class="fl">E-mailadres</label><input class="f" type="email" id="aanvraag-email" autocapitalize="off" autocorrect="off" />';
  h += '<label class="fl">Toelichting (optioneel)</label><textarea class="f" id="aanvraag-bericht" placeholder="Bijv. wie je bent of waarom je toegang nodig hebt"></textarea>';
  h += '<button class="btn-primary" ' + (state.toegangsverzoekBusy?"disabled":"") + ' onclick="verstuurToegangsaanvraag()">' + (state.toegangsverzoekBusy ? "Versturen..." : "Aanvraag versturen") + '</button>';
  h += '</div>';
  h += '<div style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:14px;">Terug naar <span style="color:var(--navy);font-weight:700;cursor:pointer;" onclick="state.authScreen=\'login\';state.authError=\'\';render();">inloggen</span></div>';
  h += '</div>';
  return h;
}
function renderToegangAanvraagVerstuurd() {
  var h = '<div style="max-width:380px;margin:80px auto;padding:0 16px;text-align:center;">';
  h += '<div style="font-size:20px;font-weight:800;margin-bottom:10px;color:var(--navy);">Aanvraag verstuurd</div>';
  h += '<div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">De beheerder heeft je aanvraag ontvangen en beoordeelt hem zo snel mogelijk. Je hoort via e-mail of je toegang krijgt.</div>';
  h += '<span style="color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline;" onclick="state.authScreen=\'login\';render();">Terug naar inloggen</span>';
  h += '</div>';
  return h;
}
function verstuurToegangsaanvraag() {
  var naam = document.getElementById("aanvraag-naam").value.trim();
  var email = document.getElementById("aanvraag-email").value.trim();
  var bericht = document.getElementById("aanvraag-bericht").value.trim();
  if (!naam || !email) { state.authError = "Vul in elk geval je naam en e-mailadres in."; render(); return; }
  if (!supabaseClient) { state.authError = "Kon geen verbinding maken. Probeer het later opnieuw."; render(); return; }
  state.toegangsverzoekBusy = true; state.authError = ""; render();
  supabaseClient.from("boekhoud_toegangsverzoeken").insert({ naam: naam, email: email, bericht: bericht, status: "in afwachting" }).then(function(res){
    state.toegangsverzoekBusy = false;
    if (res.error) { state.authError = "Versturen mislukt: " + res.error.message; render(); return; }
    state.authScreen = "aanvraag-verstuurd";
    render();
  });
}
function laadToegangsverzoeken() {
  if (!supabaseClient || !state.user) return;
  supabaseClient.from("boekhoud_toegangsverzoeken").select("*").order("created_at", { ascending: false }).then(function(res){
    if (!res.error) { state.toegangsverzoeken = res.data || []; render(); }
  });
}
function beoordeelToegangsverzoek(id, nieuweStatus) {
  if (!supabaseClient) return;
  supabaseClient.from("boekhoud_toegangsverzoeken").update({ status: nieuweStatus }).eq("id", id).then(function(res){
    if (!res.error) laadToegangsverzoeken();
  });
}
function submitAuth() {
  var email = document.getElementById("auth-email").value.trim();
  var pass = document.getElementById("auth-pass").value;
  if (!email || !pass) { state.authError = "Vul e-mailadres en wachtwoord in."; render(); return; }
  if (state.authMode === "login") doLogin(email, pass); else doSignup(email, pass);
}
function bfield(key, label, val, cls) {
  return '<div class="' + (cls||"") + '"><label class="fl">' + label + '</label><input class="f" value="' + esc(val) + '" oninput="updateBedrijfField(\'' + key + '\', this.value)" /></div>';
}

// ---------------------------------------------------------------------
// KLANT-WEERGAVE (publieke pagina via deelbare link, geen inloggen)
// ---------------------------------------------------------------------
function renderKlantOfferteView(o) {
  var b = (o.data && o.data.bedrijf_snapshot) || state.bedrijf || {};
  var t = factuurTotalen(o.data);
  var h = '<div class="wrap" style="max-width:640px;">';
  h += '<div class="r-page" style="border-radius:12px;">';
  if (b.logoData) h += '<img src="' + b.logoData + '" style="max-height:64px;max-width:220px;object-fit:contain;margin-bottom:10px;display:block;" />';
  else h += '<div class="r-brand">' + esc(b.naam || "") + '</div>';
  h += '<div class="r-title">Offerte ' + esc(o.data.offertenummer) + '</div>';
  if (o.status !== "concept") h += '<span class="badge badge-' + o.status + '" style="margin-top:8px;display:inline-block;">' + statusLabel(o.status) + '</span>';
  h += '<hr class="r-rule" />';
  h += '<div class="r-kv">' + kv2("Aan", o.data.klantNaam) + kv2("Klantnummer", o.data.klantNummer) + kv2("Datum", o.data.datum) + kv2("Geldig tot", o.data.geldigTot) + kv2("Aanbetalingsmethode", o.data.aanbetalingsmethode) + '</div>';
  h += '<table class="r-table"><thead><tr><th>Omschrijving</th><th class="num">Aantal</th><th class="num">Prijs</th><th class="num">Bedrag</th></tr></thead><tbody>';
  (o.data.regels||[]).forEach(function(r){
    var lijn = (parseFloat(r.aantal)||0)*(parseFloat(r.prijs)||0);
    h += '<tr><td>' + esc(r.omschrijving||"—") + '</td><td class="num">' + esc(r.aantal) + '</td><td class="num">' + euro(r.prijs) + '</td><td class="num">' + euro(lijn) + '</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="totals-box"><div class="totals-row grand"><span>Totaal incl. BTW</span><span>' + euro(t.totaalIncl) + '</span></div></div>';
  if (o.data.opmerking) h += '<p style="font-size:12.5px;color:#6b6659;margin-top:16px;">' + esc(o.data.opmerking) + '</p>';
  var energiePaginaCountKlant = (o.data.energieActief && o.data.energie && o.data.energie.zonActief) ? 4 : 0;
  var legplanPaginaCountKlant = o.data.legplanFoto ? 1 : 0;
  var datasheetsPaginaCountKlant = datasheetsPaginaAantal(o.data.datasheets);
  var totaalPaginasKlant = 1 + energiePaginaCountKlant + legplanPaginaCountKlant + datasheetsPaginaCountKlant;
  h += paginaVoetnoot(1, totaalPaginasKlant);
  h += '</div>';
  h += EO_renderRapportPaginas(o.data, 2, totaalPaginasKlant, b);
  h += legplanPagina(o.data, 1 + energiePaginaCountKlant + 1, totaalPaginasKlant, b);
  h += renderDatasheetsSectie(o.data.datasheets, 1 + energiePaginaCountKlant + legplanPaginaCountKlant + 1, totaalPaginasKlant, b);

  h += '<div id="klant-actie-view">';
  if (o.status === "geaccordeerd") {
    h += '<div class="alert-box info" style="text-align:center;"><b>Je bent al akkoord gegaan met deze offerte.</b></div>';
  } else if (o.status === "afgewezen") {
    h += '<div class="alert-box" style="text-align:center;"><b>Je hebt eerder aangegeven niet akkoord te gaan.</b></div>';
  } else {
    h += '<div class="section-card">';
    h += '<h2>Akkoord geven</h2>';
    h += '<label class="fl">Jouw naam (ter bevestiging)</label><input class="f" id="klant-akkoord-naam" placeholder="Voor- en achternaam" />';
    h += '<label class="fl">Zet hieronder je handtekening</label>';
    h += '<canvas id="klant-sig-canvas" width="400" height="150" style="width:100%;max-width:400px;height:150px;border:1px solid var(--border);border-radius:8px;background:#fff;touch-action:none;"></canvas>';
    h += '<button class="btn-secondary" style="margin-top:8px;" onclick="wisKlantHandtekening()">Wis handtekening</button>';
    h += '<div style="display:flex;gap:10px;margin-top:16px;">';
    h += '<button class="btn-primary" style="background:#16A34A;" onclick="klantOfferteAkkoord(\'' + o.id + '\', true)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0;"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg> Ik ga akkoord</button>';
    h += '<button class="btn-secondary" onclick="klantOfferteAkkoord(\'' + o.id + '\', false)">Ik wijs af</button>';
    h += '</div>';
    h += '<div id="klant-actie-status" style="font-size:12px;color:#5E7876;margin-top:10px;"></div>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

function checkKlantLink() {
  var params = new URLSearchParams(window.location.search);
  var offerteId = params.get("offerte");
  if (!offerteId || !supabaseClient) return false;
  document.getElementById("root").innerHTML = '<div style="text-align:center;padding:80px 20px;color:#5E7876;font-size:13px;">Offerte laden...</div>';
  supabaseClient.from("boekhoud_offertes").select("*").eq("id", offerteId).maybeSingle().then(function(res){
    if (res.error || !res.data) {
      document.getElementById("root").innerHTML = '<div style="max-width:420px;margin:60px auto;padding:24px;text-align:center;"><b>Offerte niet gevonden.</b><br/><span style="font-size:12px;color:#5E7876;">Vraag de aanbieder om een nieuwe link te sturen.</span></div>';
      return;
    }
    document.getElementById("root").innerHTML = renderKlantOfferteView(res.data);
    setTimeout(initKlantSignaturePad, 30);
  }).catch(function(){
    document.getElementById("root").innerHTML = '<div style="max-width:420px;margin:60px auto;padding:24px;text-align:center;"><b>Kon geen verbinding maken.</b><br/><span style="font-size:12px;color:#5E7876;">Check je internetverbinding en probeer het opnieuw.</span></div>';
  });
  return true;
}

if (!checkKlantLink()) {
  checkSession();
}
</script>
