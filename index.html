<style>

  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing:-0.01em; color:#0B2E2D; }
  h2 { font-size: 16.5px; font-weight: 800; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid #0D9488; padding-bottom: 8px; color:#0B2E2D; }

  .overzicht-link { font-size:11.5px; font-weight:700; color:#4d493f; background:#fff; border:1px solid #E0DDD4; border-radius:8px; padding:6px 10px; cursor:pointer; }

  .card-btn-inner { display:flex; align-items:center; flex:1; }

  input.f, select.f, textarea.f { width:100%; border:1px solid #cfd8d6; border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit; margin-bottom:12px; background:#fff; color:#0B2E2D; }

  textarea.f { resize:vertical; min-height:48px; }

  .item-block { border:1px solid #4FA893; border-radius:12px; padding:14px; margin-bottom:12px; background:linear-gradient(90deg, #9ED9C9 0%, #D6EFE7 100%); color:#0B2E2D; }
  .item-block-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px; }
  .item-num { font-size:11px; color:#8A8578; font-weight:700; padding-top:9px; }
  .item-omschrijving { flex:1; border:none; background:transparent; font-size:13.5px; font-weight:600; outline:none; padding:8px 0; }
  .item-title-input { flex:1; border:none; background:transparent; font-size:14px; font-weight:800; outline:none; padding:4px 0; color:#0B2E2D; }

  .item-block-light .item-title-input::placeholder { color:#8A8578; }

  .del-x { background:none; border:none; color:#B23A2F; font-size:17px; cursor:pointer; padding:4px 6px; line-height:1; }

  .btn-primary { background:#0B3B3C; color:#fff; border:none; border-radius:9px; padding:12px 16px; font-size:13.5px; font-weight:700; cursor:pointer; width:100%; }
  .btn-secondary { background:#fff; color:#0B3B3C; border:1.5px solid #E0DDD4; border-radius:9px; padding:11px; font-size:13px; font-weight:700; cursor:pointer; width:100%; }
  .btn-save { background:#2F7D3A; color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-add { background:none; border:1.5px dashed #0D9488; color:#0B3B3C; border-radius:9px; padding:10px; font-size:12.5px; font-weight:700; cursor:pointer; width:100%; margin-top:6px; }
  .backbtn { background:none; border:none; color:#6b6659; font-size:13px; font-weight:600; cursor:pointer; padding:0; margin-bottom:14px; display:flex; align-items:center; gap:4px; }

  .class-chip.active[data-c="ernstig"] { background:#DC3B2E; color:#fff; border-color:#DC3B2E; }
  .class-chip.active[data-c="serieus"] { background:#E8952E; color:#fff; border-color:#E8952E; }
  .class-chip.active[data-c="gering"] { background:#D9B400; color:#fff; border-color:#D9B400; }
  .class-chip.active[data-c="opmerking"] { background:#4F94D4; color:#fff; border-color:#4F94D4; }
  .class-chip.active[data-c="goed"] { background:#2F7D3A; color:#fff; border-color:#2F7D3A; }
  .class-chip.active[data-c="nader"] { background:#6B4C9A; color:#fff; border-color:#6B4C9A; }
  .badge { display:inline-block; font-size:10px; font-weight:800; padding:3px 10px; border-radius:999px; color:#fff; letter-spacing:0.01em; }

  .photo-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .photo-thumb { width:52px; height:52px; object-fit:cover; border-radius:7px; border:1px solid #E0DDD4; }
  .photo-wrap { position:relative; }
  .photo-wrap button { position:absolute; top:-6px; right:-6px; width:17px; height:17px; border-radius:999px; background:#0B3B3C; color:#fff; border:2px solid #FCFBF9; font-size:10px; line-height:13px; padding:0; cursor:pointer; }
  .photo-add { font-size:10.5px; border:1.5px dashed #0D9488; border-radius:7px; padding:7px 11px; cursor:pointer; color:#0B3B3C; font-weight:600; white-space:nowrap; }

  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:8px; flex-wrap:wrap; }
  .print-btn { background:#0B3B3C; color:#fff; border:none; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }

  .stats-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .stat-box { flex:1; min-width:70px; background:linear-gradient(135deg, #E8F5F2 0%, #ffffff 100%); border:2px solid #7FD9CB; border-radius:10px; padding:12px 10px; text-align:center; }
  .stat-num { font-size:24px; font-weight:800; color:#0B3B3C; }
  .stat-label { font-size:10px; color:#4d6360; margin-top:2px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }

  .keuring-row:hover { border-color:#0B3B3C; }
  .keuring-left { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .keuring-klant { font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .keuring-meta { font-size:11px; color:#6b6659; }
  .keuring-del { background:none; border:none; color:#B23A2F; font-size:15px; cursor:pointer; padding:4px; flex-shrink:0; }
  .empty-state { text-align:center; padding:26px 16px; color:#6b6659; font-size:12.5px; border:1.5px dashed #D8D4CB; border-radius:14px; }
  .autosave-note { font-size:11px; color:#8A8578; text-align:center; margin-top:10px; }

  .streng-block { border:1px solid #C9D9CE; background:#EAF1EC; border-radius:10px; padding:8px; margin-top:8px; }

  .streng-block .item-num { color:#8A8578; }
  .streng-block .photo-add { color:#0B3B3C; border-color:#0D9488; padding:4px 8px; font-size:9.5px; }
  .streng-block input.f, .streng-block select.f, .streng-block textarea.f { padding:7px 9px; margin-bottom:6px; font-size:12.5px; }
  .streng-block .class-chip { padding:4px 8px; font-size:10px; }
  .streng-block .class-row { margin:5px 0 2px; gap:4px; }
  .mini-select { width:100%; border:1px solid #E0DDD4; border-radius:7px; padding:8px 9px; font-size:12.5px; font-family:inherit; margin-bottom:10px; background:#fff; }

  .r-page { background:#fff; border:1px solid #E0DDD4; padding:30px 32px; margin-bottom:14px; font-family:'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; }
  .r-brand { font-size:11px; color:#6b6659; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; }
  .r-title { font-size:22px; font-weight:700; margin-top:6px; letter-spacing:-0.01em; }
  .r-sub { font-size:12px; font-weight:600; color:#4d493f; margin-top:3px; }
  .r-rule { border:none; border-top:2px solid #0D9488; margin:14px 0 20px; }
  .r-kv { display:grid; grid-template-columns:170px 1fr; gap:6px 0; font-size:12.5px; margin-top:14px; }
  .r-kv .k { color:#6b6659; font-weight:500; }
  .r-h { font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin:2px 0 14px; padding-bottom:8px; border-bottom:1px solid #E0DDD4; }
  .r-page h3 { font-weight:600; letter-spacing:0.01em; color:#1c1c1c; }
  .r-page table.r-table th { color:#6b6659; border-bottom-color:#E0DDD4; }
  .r-page table.r-table td { color:#1c1c1c; border-bottom-color:#F0EEE7; }
  table.r-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  table.r-table th { text-align:left; font-size:10.5px; color:#6b6659; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; border-bottom:1px solid #E0DDD4; padding:6px 6px 6px 0; }
  table.r-table td { padding:8px 6px 8px 0; border-bottom:1px solid #F0EEE7; vertical-align:top; font-weight:400; color:#1c1c1c; }
  .r-constatering { border:1px solid #E0DDD4; border-radius:8px; margin:9px 0; overflow:hidden; }
  .r-constatering-head { display:flex; justify-content:space-between; align-items:center; background:#F5F4EF; padding:8px 12px; font-size:11.5px; font-weight:600; gap:8px; }
  .r-constatering-body { padding:12px; font-size:12px; }
  .r-photos { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .r-photos img { width:76px; height:76px; object-fit:cover; border-radius:5px; border:1px solid #E0DDD4; }
  .r-sig-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:30px; }
  .r-sig-box { border-top:1px solid #0B3B3C; padding-top:7px; font-size:11px; margin-top:48px; }
  .r-conclusie-badge { display:inline-block; font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; margin-top:8px; }

  .auth-wrap { max-width:380px; margin:60px auto; padding:0 16px; }
  .auth-logo { font-size:32px; text-align:center; margin-bottom:8px; }
  .auth-title { font-size:20px; font-weight:800; text-align:center; margin-bottom:4px; }
  .auth-sub { font-size:12.5px; color:#6b6659; text-align:center; margin-bottom:20px; }
  .auth-error { background:#FBEAE8; color:#B23A2F; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  .auth-switch { text-align:center; font-size:12.5px; color:#6b6659; margin-top:14px; }
  .auth-switch a { color:#0B3B3C; font-weight:700; text-decoration:none; }
  .sync-badge { font-size:10px; font-weight:700; padding:6px 10px; border-radius:8px; display:inline-flex; align-items:center; }
  .sync-badge.online { background:#EAF6EC; color:#2F7D3A; }
  .sync-badge.syncing { background:#F5F4EF; color:#4d493f; }

  @media print {
    body { background:#fff; }
    .header, .toolbar, .steps, .no-print { display:none !important; }
    .wrap { max-width:100%; padding:0; }
    .r-page { border:none; padding:0; page-break-after: always; }
  }
</style>

<script>

}

// Zet geüploade bestanden om naar data-URL's (base64) i.p.v. tijdelijke blob-URL's,
// zodat foto's ook na het herladen van de pagina behouden blijven in localStorage.
function filesToDataUrls(files, callback) {
  var results = new Array(files.length);
  var remaining = files.length;
  if (remaining === 0) { callback(results); return; }
  // Foto's worden verkleind/gecomprimeerd voordat ze worden opgeslagen — anders leveren
  // moderne telefoons foto's van 3-8MB per stuk aan, wat opslaan (lokaal én naar de cloud)
  // onnodig traag maakt. 1600px lange zijde is ruim genoeg voor een scherp PDF-rapport.
  var MAX_AFMETING = 1600;
  var KWALITEIT = 0.8;
  Array.prototype.forEach.call(files, function(f, idx){
    var reader = new FileReader();
    reader.onload = function(e) {
      var origineel = e.target.result;
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > MAX_AFMETING || h > MAX_AFMETING) {
          if (w >= h) { h = Math.round(h * (MAX_AFMETING / w)); w = MAX_AFMETING; }
          else { w = Math.round(w * (MAX_AFMETING / h)); h = MAX_AFMETING; }
        }
        try {
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          results[idx] = canvas.toDataURL("image/jpeg", KWALITEIT);
        } catch (err) {
          results[idx] = origineel; // kon niet comprimeren: gebruik het origineel als terugval
        }
        remaining--;
        if (remaining === 0) callback(results);
      };
      img.onerror = function() {
        results[idx] = origineel; // geen geldige afbeelding om te verkleinen: origineel gebruiken
        remaining--;
        if (remaining === 0) callback(results);
      };
      img.src = origineel;
    };
    reader.onerror = function() { remaining--; if (remaining === 0) callback(results); };
    reader.readAsDataURL(f);
  });
}

// Bepaalt de spanning die bij een circuit hoort: tussen twee fases (L1-L2 e.d.) is dat 400V,

function checkSession() {
  if (!supabaseClient) {
    state.view = "auth";
    state.authError = "Kan geen verbinding maken (internetverbinding nodig om in te loggen). Controleer je verbinding en herlaad de pagina.";
    render();
    return;
  }
  supabaseClient.auth.getSession().then(function(res) {
    var session = res.data && res.data.session;
    if (session && session.user) {
      state.user = session.user;
      naLogin();
    } else {
      state.view = "auth";
      render();
    }
  }).catch(function() { state.view = "auth"; render(); });
}
function naLogin() {
  checkLicentie(function() {
    if (!state.isAdmin && state.licentieStatus !== "actief") {
      state.view = "wacht-op-goedkeuring";
      render();
      return;
    }
    if (state.moetWachtwoordInstellen) {
      state.view = "wachtwoord-instellen";
      render();
      return;
    }
    laadBedrijfsgegevensUitCloud(function() {
      document.title = state.object.appNaam || "Keuringen app";
      laadKlanten(function() {
        state.view = "kies";
        render();
        ververConceptUitDraft();
      });
    });
  });
}
function checkLicentie(callback) {
  if (!supabaseClient || !state.user) { state.licentieStatus = "actief"; state.isAdmin = false; state.mijnRol = "eigenaar"; state.companyId = null; callback(); return; }
  supabaseClient.from("licenties").select("*").eq("user_id", state.user.id).maybeSingle().then(function(res) {
    if (res.error) {
      // Een ECHTE fout (bv. tijdelijke storing) — nooit aannemen dat de gebruiker
      // nieuw is en dus nooit een tweede account proberen aan te maken.
      state.licentieStatus = "fout";
      callback();
      return;
    }
    if (res.data) {
      state.licentieStatus = res.data.status;
      state.isAdmin = !!res.data.is_admin;
      state.mijnRol = res.data.rol || "eigenaar";
      state.companyId = res.data.company_id || state.user.id;
      callback();
    } else {
      // Hier weten we zeker dat er geen fout was EN geen rij bestaat: pas dan
      // is dit echt de eerste keer voor deze gebruiker.
      supabaseClient.from("licenties").insert({ user_id: state.user.id, email: state.user.email, status: "inactief", rol: "eigenaar", company_id: state.user.id }).then(function(insertRes) {
        if (insertRes.error) { state.licentieStatus = "fout"; callback(); return; }
        state.licentieStatus = "inactief";
        state.isAdmin = false;
        state.mijnRol = "eigenaar";
        state.companyId = state.user.id;
        callback();
      }).catch(function(){ state.licentieStatus = "fout"; callback(); });
    }
  }).catch(function(){ state.licentieStatus = "fout"; callback(); });
}

    if (res.error || !res.data) { alert("Ophalen mislukt: " + (res.error ? res.error.message : "onbekende fout")); return; }
    if (!navigator.share) { alert("Je toestel/browser ondersteunt geen deelfunctie. Gebruik de downloadknop en verstuur het bestand handmatig."); return; }
    var file = new File([res.data], naam, { type: "application/pdf" });
    if (navigator.canShare && !navigator.canShare({ files: [file] })) { alert("Bijlages delen wordt hier niet ondersteund."); return; }

// ---------------------------------------------------------------------
// Ketting van automatische overnames: Installatie -> Contactpersoon ->
// Contactpersoon (eigenaar) -> Opdrachtgever, en Installatie -> Eigenaar ->
// Opdrachtgever. Elke schakel heeft een eigen aan/uit-vinkje. cascadeUpdate
// werkt de hele ketting recursief bij zodra er ergens bovenaan iets wijzigt.
// ---------------------------------------------------------------------
var SYNC_CHAIN = [
  [INSTALLATIE_CONTACT_MAP, "contactZelfdeAlsInstallatie"],
  [INSTALLATIE_EIGENAAR_MAP, "eigenaarZelfdeAlsInstallatie"],
  [INSTALLATIE_EIGENAAR_CONTACT_MAP, "eigenaarContactZelfde"],
  [EIGENAAR_OPDRACHTGEVER_MAP, "opdrachtgeverZelfde"],

function cascadeUpdate(key, val) {
  SYNC_CHAIN.forEach(function(pair){
    var map = pair[0], vlag = pair[1];

      var doel = map[key];
      state.object[doel] = val;
      cascadeUpdate(doel, val);
    }
  });
}
function syncMapIfEnabled(map, vlag) {
  if (!state.object[vlag]) return;
  Object.keys(map).forEach(function(k){
    var val = state.object[k];
    state.object[map[k]] = val;
    cascadeUpdate(map[k], val);
  });
}

  var pcLetters = (pc.match(/[A-Z]+/) || [""])[0];
  var huisnummerMatch = (o.adres || "").match(/(\d+)\s*[a-zA-Z]?\s*$/);
  var huisnummer = huisnummerMatch ? huisnummerMatch[1] : "";
  var scios = (o.scioscode || "").trim().replace(/\s+/g, "");
  if (pcCijfers && pcLetters && scios) {
    return pcCijfers + "_" + pcLetters + (huisnummer ? "_" + huisnummer : "") + "_" + scios;
  }

// Opslag
function saveKeuring() {
  var list = loadSaved();
  var record = { id: state.savedId || uid(), savedAt: new Date().toISOString(), view: state.laatsteWerkStap || state.view, type: state.type, object: state.object, items: state.items, verdelers: state.verdelers, omvormers: state.omvormers, constateringen: state.constateringen };
  var idx = list.findIndex(function(r){return r.id===record.id;});
  if (idx >= 0) list[idx] = record; else list.unshift(record);
  var lokaalGelukt = persistSaved(list); // lokale back-up
  state.savedId = record.id;
  if (!lokaalGelukt) {
    alert("Lokaal opslaan op dit toestel is mislukt \u2014 waarschijnlijk is de opslagruimte van je browser vol (te veel foto's in oude keuringen). Verwijder oude, afgeronde keuringen die je niet meer nodig hebt via het overzicht, en probeer opnieuw. " + (supabaseClient && state.user ? "De cloud-opslag wordt hierna nog wel geprobeerd." : ""));
  } else {
    toonToast("Keuring opgeslagen" + (record.object && record.object.klant ? " \u2014 " + record.object.klant : ""));
  }

  if (supabaseClient && state.user) {
    state.syncStatus = "syncing"; render();
    var rij = {
      id: record.id, user_id: state.user.id, type: record.type,
      klant: (record.object && record.object.klant) || "",
      datum: (record.object && record.object.datum) || null,
      data: { object: record.object, items: record.items, verdelers: record.verdelers, omvormers: record.omvormers, constateringen: record.constateringen, laatsteWerkStap: record.view },
      created_at: new Date().toISOString(),
    };
    supabaseClient.from("keuringen").upsert(rij).then(function(res) {
      state.syncStatus = res.error ? "" : "opgeslagen";
      render();
      if (res.error) {
        alert("Cloud-opslag mislukt (lokaal is het wel bewaard):\n\n" + (res.error.message || JSON.stringify(res.error)));
      }
    }).catch(function(err){
      state.syncStatus = ""; render();
      alert("Cloud-opslag mislukt (lokaal is het wel bewaard):\n\n" + (err && err.message ? err.message : String(err)));
    });
  }
}
function laadCloudKeuringen(callback) {
  if (!supabaseClient || !state.user) { callback && callback(); return; }
  state.cloudLoading = true; render();
  // Geen .eq("user_id", ...) filter meer hier: welke rijen je terugkrijgt wordt nu bepaald
  // door de RLS-policy in Supabase (eigen keuringen, en als je "eigenaar" bent ook die van
  // je medewerkers). Zonder de juiste RLS-policy in Supabase krijgt iedereen dus alleen
  // zijn eigen rijen (standaardgedrag), tenzij de eigenaar-policy actief is.
  supabaseClient.from("keuringen").select("*").order("created_at", { ascending: false }).then(function(res) {
    state.cloudLoading = false;
    if (!res.error && res.data) {
      state.cloudKeuringen = res.data.map(function(rij){
        return { id: rij.id, type: rij.type, object: rij.data.object, items: rij.data.items, verdelers: rij.data.verdelers || [], omvormers: rij.data.omvormers || [], constateringen: rij.data.constateringen || [], view: rij.data.laatsteWerkStap || "", eigenaarUserId: rij.user_id };
      });
    }
    render();
    callback && callback();
  }).catch(function(){ state.cloudLoading = false; render(); callback && callback(); });
}

  supabaseClient.from("licenties").select("*").eq("company_id", state.companyId).order("aangemaakt_op", { ascending: false }).then(function(res) {

function voegMedewerkerToe() {
  var email = (document.getElementById("nieuweMedewerkerEmail") || {}).value;
  if (!email || email.indexOf("@") === -1) { alert("Vul een geldig e-mailadres in."); return; }

var STORAGE_KLANTEN = "keuringen_klanten_lokaal";
function newKlant() {
  return { id: uid(), naam: "", adres: "", postcode: "", plaats: "", contactNaam: "", contactTel: "", contactEmail: "", eigenaarNaam: "", eigenaarAdres: "", opdrachtgeverNaam: "" };
}
function loadKlantenLokaal() { try { var raw = localStorage.getItem(STORAGE_KLANTEN); return raw ? JSON.parse(raw) : []; } catch(e) { return []; } }
function persistKlantenLokaal() { try { localStorage.setItem(STORAGE_KLANTEN, JSON.stringify(state.klanten)); } catch(e) {} }
function laadKlanten(callback) {
  if (!supabaseClient || !state.user) { state.klanten = loadKlantenLokaal(); callback && callback(); return; }
  supabaseClient.from("keuringen_klanten").select("*").eq("user_id", state.user.id).order("created_at", { ascending: false }).then(function(res) {
    if (!res.error && res.data) { state.klanten = res.data.map(function(rij){ return rij.data; }); persistKlantenLokaal(); }
    else { state.klanten = loadKlantenLokaal(); }
    render();
    callback && callback();
  }).catch(function(){ state.klanten = loadKlantenLokaal(); render(); callback && callback(); });
}
function syncKlantNaarCloud(k) {
  if (!supabaseClient || !state.user) return;
  supabaseClient.from("keuringen_klanten").upsert({ id: k.id, user_id: state.user.id, data: k, created_at: new Date().toISOString() }).then(function(res){
    if (res.error) { alert("Cloud-opslag klant mislukt (lokaal is het wel bewaard):\n\n" + res.error.message); }
  });
}
function nieuweKlant() {
  var k = newKlant();
  state.klanten.unshift(k);
  persistKlantenLokaal();
  syncKlantNaarCloud(k);
  state.huidigeKlantId = k.id;
  setState({ view: "klant-form" });
}
function bewerkKlant(id) { state.huidigeKlantId = id; setState({ view: "klant-form" }); if (supabaseClient && state.user && !state.cloudKeuringen.length) laadCloudKeuringen(); }
function updateKlantField(id, key, val) {
  var k = state.klanten.find(function(x){return x.id===id;});
  if (k) k[key] = val;
  persistKlantenLokaal();
}
function opslaanKlant(id) {
  var k = state.klanten.find(function(x){return x.id===id;});
  if (k) syncKlantNaarCloud(k);
  persistKlantenLokaal();
  toonToast('Klant "' + (k ? k.naam || "Naamloos" : "") + '" opgeslagen');
  setTimeout(function(){ setState({ view: "klanten" }); }, 2000);
}
function verwijderKlant(id) {
  vraagBevestiging("Deze klant definitief verwijderen?", function(){
    state.klanten = state.klanten.filter(function(x){return x.id!==id;});
    persistKlantenLokaal();
    if (supabaseClient && state.user) supabaseClient.from("keuringen_klanten").delete().eq("id", id).then(function(){});
    render();
  });
}
function kiesKlantVoorKeuring(id) {
  var k = state.klanten.find(function(x){return x.id===id;});
  if (!k) return;
  state.object.klantId = k.id;
  state.object.klant = k.naam; state.object.adres = k.adres; state.object.postcode = k.postcode; state.object.plaats = k.plaats;
  state.object.telefoonInstallatie = k.contactTel; state.object.emailInstallatie = k.contactEmail;
  state.object.installatieverantwoordelijke = k.contactNaam;
  // Alleen overschrijven als de klant hier zelf een afwijkende waarde voor heeft opgeslagen;
  // anders vult de cascade hieronder dit automatisch met de installatiegegevens (via de
  // bestaande "zelfde als"-vinkjes).
  if (k.eigenaarNaam) state.object.eigenaarNaam = k.eigenaarNaam;
  if (k.eigenaarAdres) state.object.eigenaarAdres = k.eigenaarAdres;
  if (k.opdrachtgeverNaam) state.object.opdrachtgeverNaam = k.opdrachtgeverNaam;
  // Ketting van automatische overnames opnieuw toepassen: Installatie -> Contactpersoon ->
  // Eigenaar -> Contactpersoon (eigenaar) -> Opdrachtgever, elk respecterend of het
  // bijbehorende "zelfde als"-vinkje aan of uit staat.
  syncContactVanInstallatie();
  syncEigenaarVanInstallatie();
  syncEigenaarContactVanInstallatie();
  syncOpdrachtgeverVanEigenaar();
  // Extra garantie: als de naam-velden na de ketting nog steeds leeg zijn (en het
  // bijbehorende "zelfde als"-vinkje aan staat), vul ze alsnog rechtstreeks in.
  if (!state.object.contactNaam && state.object.contactZelfdeAlsInstallatie) state.object.contactNaam = state.object.installatieverantwoordelijke;
  if (!state.object.eigenaarNaam && state.object.eigenaarZelfdeAlsInstallatie) state.object.eigenaarNaam = state.object.installatieverantwoordelijke;
  if (!state.object.eigenaarAdres && state.object.eigenaarZelfdeAlsInstallatie) state.object.eigenaarAdres = state.object.adres;
  if (!state.object.eigenaarContactNaam && state.object.eigenaarContactZelfde) state.object.eigenaarContactNaam = state.object.contactNaam;
  if (!state.object.opdrachtgeverNaam && state.object.opdrachtgeverZelfde) state.object.opdrachtgeverNaam = state.object.eigenaarNaam;
  if (!state.object.opdrachtgeverContactNaam && state.object.opdrachtgeverZelfde) state.object.opdrachtgeverContactNaam = state.object.eigenaarContactNaam;
  persistDraft();
  render();
}
function keuringenVanKlant(k) {
  var alle = (state.cloudKeuringen && state.cloudKeuringen.length ? state.cloudKeuringen : loadSaved());
  return alle.filter(function(r){
    if (k.id && r.object && r.object.klantId === k.id) return true;
    return r.object && r.object.klant && k.naam && r.object.klant.trim().toLowerCase() === k.naam.trim().toLowerCase();
  });
}
function openSaved(id) {
  var r = state.cloudKeuringen.find(function(x){return x.id===id;}) || loadSaved().find(function(x){return x.id===id;});
  if (!r) return;
  state.type = r.type; state.object = r.object; state.items = r.items;
  state.verdelers = r.verdelers || []; state.omvormers = r.omvormers || []; state.constateringen = r.constateringen || []; state.savedId = r.id;
  normalizeState();
  var stapOrder = getStepOrder();

}
function deleteSaved(id, ev) {
  if (ev) ev.stopPropagation();
  vraagBevestiging("Deze opgeslagen keuring definitief verwijderen? Dit verwijdert 'm ook uit de cloud.", function(){

    }

function nieuweKeuring() {
  try { localStorage.removeItem(STORAGE_DRAFT); } catch(e) {}
  state.type = null; state.object = emptyObject(); state.items = []; state.verdelers = []; state.omvormers = []; state.savedId = null; state.syncStatus = "";

function slaVoortgangOp() {
  persistDraft();
  var list = loadSaved();
  var record = { id: state.savedId || uid(), savedAt: new Date().toISOString(), view: state.laatsteWerkStap || state.view, type: state.type, object: state.object, items: state.items, verdelers: state.verdelers, omvormers: state.omvormers, constateringen: state.constateringen };
  var idx = list.findIndex(function(r){return r.id===record.id;});
  if (idx >= 0) list[idx] = record; else list.unshift(record);
  persistSaved(list);
  state.savedId = record.id;
  toonToast("Voortgang opgeslagen \u2014 je kunt later gewoon verdergaan");
  setTimeout(function(){ setState({ view: "overzicht" }); laadCloudKeuringen(); }, 2000);

  if (supabaseClient && state.user) {
    state.syncStatus = "syncing"; render();
    var rij = {
      id: record.id, user_id: state.user.id, type: record.type,
      klant: (record.object && record.object.klant) || "",
      datum: (record.object && record.object.datum) || null,
      data: { object: record.object, items: record.items, verdelers: record.verdelers, omvormers: record.omvormers, constateringen: record.constateringen, laatsteWerkStap: record.view },
      created_at: new Date().toISOString(),
    };
    supabaseClient.from("keuringen").upsert(rij).then(function(res) {
      state.syncStatus = res.error ? "" : "opgeslagen";
      render();
      if (res.error) {
        alert("Cloud-opslag mislukt (lokaal is het wel bewaard):\n\n" + (res.error.message || JSON.stringify(res.error)));
      }
    }).catch(function(err){
      state.syncStatus = ""; render();
      alert("Cloud-opslag mislukt (lokaal is het wel bewaard):\n\n" + (err && err.message ? err.message : String(err)));
    });
  }
}

function voegInspecteurMeetinstrumentToe(inspecteurId) {

function verwijderInspecteurMeetinstrument(inspecteurId, meetId) {

function updateInspecteurMeetinstrument(inspecteurId, meetId, key, val) {

function exporteerInstellingenBackup() {
  var data = {};
  BEDRIJF_VELDEN.forEach(function(k){ data[k] = state.object[k]; });
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "instellingen-backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toonToast("&#10003; Back-up gedownload");
}
function importeerInstellingenBackup(files) {
  if (!files || !files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      BEDRIJF_VELDEN.forEach(function(k){ if (data[k] !== undefined) state.object[k] = data[k]; });
      persistBedrijfsgegevens();
      toonToast("&#10003; Back-up ingeladen en opgeslagen");
      render();
    } catch (err) {
      toonToast("Kon back-upbestand niet lezen");
    }
  };
  reader.readAsText(files[0]);
}

// Adresveld met live suggesties (PDOK Locatieserver, gratis NL adressen-API, geen key nodig).
// Typ bijv. "Steenbakkerij 23" -> toont alle plaatsen in NL waar dat adres bestaat, met postcode
// en plaats erbij. Bij een keuze worden adres + postcode + plaats automatisch ingevuld.
// updateFnName/callArgsPrefix: zelfde conventie als selectMetVrijeTekst hierboven.
function adresField(key, label, val, postcodeKey, plaatsKey, updateFnName, callArgsPrefix, cls) {
  var suggId = "sugg_" + key;
  var prefixArg = callArgsPrefix ? ("'" + callArgsPrefix + "', ") : "";
  var pcArg = postcodeKey ? ("'" + postcodeKey + "'") : "null";
  var plArg = plaatsKey ? ("'" + plaatsKey + "'") : "null";
  var prefixJsArg = callArgsPrefix ? ("'" + callArgsPrefix + "'") : "null";
  return '<div class="' + (cls||"full") + '" style="position:relative;">' +
    '<label class="fl">' + esc(label) + '</label>' +
    '<input class="f" id="field_' + key + '" type="text" autocomplete="off" data-adreskey="' + key + '" placeholder="bijv. Steenbakkerij 23" value="' + esc(val) + '" ' +
      'oninput="' + updateFnName + '(' + prefixArg + '\'' + key + '\', this.value); zoekAdresSuggesties(this, \'' + suggId + '\', ' + pcArg + ', ' + plArg + ', \'' + updateFnName + '\', ' + prefixJsArg + ')" ' +
      'onblur="setTimeout(function(){ var el=document.getElementById(\'' + suggId + '\'); if (el) el.style.display=\'none\'; }, 200)" />' +
    '<div id="' + suggId + '" class="adres-sugg-list"></div>' +
  '</div>';
}
// Debounce + fetch van adressuggesties. Wordt aangeroepen vanuit oninput van adresField().
function zoekAdresSuggesties(inputEl, suggId, postcodeKey, plaatsKey, updateFnName, callArgsPrefix) {
  var suggEl = document.getElementById(suggId);
  if (!suggEl) return;
  var q = inputEl.value.trim();
  if (q.length < 4) { suggEl.style.display = "none"; suggEl.innerHTML = ""; return; }
  clearTimeout(window.__adresDebounceTimer);
  suggEl.style.display = "block";
  suggEl.innerHTML = '<div class="adres-sugg-item" style="color:#8a8578;font-style:italic;">Zoeken&hellip;</div>';
  window.__adresDebounceTimer = setTimeout(function(){
    var myToken = (window.__adresFetchToken = (window.__adresFetchToken || 0) + 1);
    fetch("https://api.pdok.nl/bzk/locatieserver/search/v3_1/suggest?rows=8&fq=type:adres&q=" + encodeURIComponent(q))
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(data){
        if (myToken !== window.__adresFetchToken) return;
        var docs = (data && data.response && data.response.docs) || [];
        if (!docs.length) { suggEl.innerHTML = '<div class="adres-sugg-item" style="color:#8a8578;font-style:italic;">Geen adressen gevonden.</div>'; return; }
        suggEl.innerHTML = docs.map(function(d){
          return '<div class="adres-sugg-item" data-id="' + esc(d.id) + '">' + esc(d.weergavenaam || "") + '</div>';
        }).join("");
        suggEl.style.display = "block";
        Array.prototype.forEach.call(suggEl.querySelectorAll(".adres-sugg-item"), function(el){
          el.onmousedown = function(e){ e.preventDefault(); kiesAdresSuggestie(el.getAttribute("data-id"), inputEl, suggEl, postcodeKey, plaatsKey, updateFnName, callArgsPrefix); };
        });
      })
      .catch(function(err){
        if (myToken !== window.__adresFetchToken) return;
        suggEl.innerHTML = '<div class="adres-sugg-item" style="color:#B5433A;">Kon geen suggesties ophalen (geen internet, of geopend als lokaal bestand). Vul handmatig in.</div>';
        if (window.console && console.error) console.error("Adressuggesties-fout:", err);
      });
  }, 300);
}
// Haalt de volledige, opgesplitste adresgegevens op (straat, huisnummer, postcode, plaats) en vult
// het adresveld + (indien opgegeven) de losse postcode-/plaatsvelden meteen zichtbaar in.
function kiesAdresSuggestie(id, inputEl, suggEl, postcodeKey, plaatsKey, updateFnName, callArgsPrefix) {
  suggEl.innerHTML = '<div class="adres-sugg-item" style="color:#8a8578;font-style:italic;">Laden&hellip;</div>';
  fetch("https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup?id=" + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(data){
      suggEl.style.display = "none"; suggEl.innerHTML = "";
      var doc = data && data.response && data.response.docs && data.response.docs[0];
      if (!doc) return;
      var nr = (doc.huisnummer != null ? String(doc.huisnummer) : "");
      var letter = doc.huisletter || "";
      var toev = doc.huisnummertoevoeging ? ("-" + doc.huisnummertoevoeging) : "";
      var straatNr = ((doc.straatnaam || "") + " " + nr + letter + toev).trim();
      var postcode = doc.postcode || "";
      var plaats = doc.woonplaatsnaam || "";
      var adresVal = (!postcodeKey && !plaatsKey && (postcode || plaats)) ? (straatNr + ", " + postcode + " " + plaats).trim() : straatNr;
      inputEl.value = adresVal;
      var fn = window[updateFnName];
      if (typeof fn !== "function") return;
      var adresKey = inputEl.getAttribute("data-adreskey");
      var args = callArgsPrefix ? [callArgsPrefix] : [];
      fn.apply(null, args.concat([adresKey, adresVal]));
      if (postcodeKey) {
        fn.apply(null, args.concat([postcodeKey, postcode]));
        var pcEl = document.getElementById("field_" + postcodeKey);
        if (pcEl) pcEl.value = postcode;
      }
      if (plaatsKey) {
        fn.apply(null, args.concat([plaatsKey, plaats]));
        var plEl = document.getElementById("field_" + plaatsKey);
        if (plEl) plEl.value = plaats;
      }
    })
    .catch(function(){ suggEl.style.display = "none"; suggEl.innerHTML = ""; });
}

function verzamelConstateringenMetBron() {
  var res = [];
  function voegToe(bron, item, omschrijving) {
    if (item.classificatie === "goed") return;
    res.push({ bron: bron, classificatie: item.classificatie, opmerking: item.opmerking, omschrijving: omschrijving, norm: item.norm, fotos: item.fotos || [], origineel: item });
  }
  state.items.forEach(function(it){ voegToe("Algemeen keuringspunt", it, it.omschrijving); });
  if (state.type === "scope12") {
    (state.object.documentatie || []).forEach(function(d, idx){
      var def = DOC_CHECKLIST_DEFS[idx];
      if (d.beschikbaarheid === "Niet beschikbaar" && def) {
        voegToe(esc(def.label), d, esc(def.label) + " is niet beschikbaar/aangeleverd.");
      }
    });
  }
  state.verdelers.forEach(function(v){
    voegToe("Verdeler - " + (v.naam || "onbekend"), v, v.opmerking);
    (v.zsMetingen||[]).forEach(function(m){ voegToe("Verdeler " + (v.naam||"") + " - Zs (foutlusimpedantie) " + (m.circuit||""), m, m.opmerking); });
    (v.ziMetingen||[]).forEach(function(m){ voegToe("Verdeler " + (v.naam||"") + " - Zi (lusimpedantie) " + (m.circuit||""), m, m.opmerking); });
    (v.risoMetingen||[]).forEach(function(m){ voegToe("Verdeler " + (v.naam||"") + " - Riso " + (m.circuit||""), m, m.opmerking); });
    (v.rloMetingen||[]).forEach(function(m){ voegToe("Verdeler " + (v.naam||"") + " - RLo " + (m.omschrijving||""), m, m.opmerking); });
  });
  state.omvormers.forEach(function(o){
    voegToe("Omvormer - " + (o.naam || "onbekend"), o, o.opmerking);
    (o.zsMetingen||[]).forEach(function(m){ voegToe("Omvormer " + (o.naam||"") + " - Zs (foutlusimpedantie) " + (m.circuit||""), m, m.opmerking); });
    (o.ziMetingen||[]).forEach(function(m){ voegToe("Omvormer " + (o.naam||"") + " - Zi (lusimpedantie) " + (m.circuit||""), m, m.opmerking); });
    (o.risoMetingen||[]).forEach(function(m){ voegToe("Omvormer " + (o.naam||"") + " - Riso " + (m.circuit||""), m, m.opmerking); });
    (o.strengen||[]).forEach(function(s){ voegToe("Omvormer " + (o.naam||"") + " - Streng " + (s.naam||""), s, s.opmerking); });
    (o.rloMetingen||[]).forEach(function(m){ voegToe("Omvormer " + (o.naam||"") + " - RLo " + (m.omschrijving||""), m, m.opmerking); });
  });
  state.constateringen.forEach(function(c){ voegToe("Vrije constatering", c, c.omschrijving); });
  return res;
}
// Geeft het doorlopende volgnummer van een item terug, gebaseerd op zijn positie in de
// centrale, volledige lijst van constateringen — zo krijgt elk onderdeel (documentatie,
// verdelers, omvormers, vrije constateringen) overal in het rapport hetzelfde, unieke nummer.
function nummerVoorItem(item) {
  if (!state._cGenLijst) state._cGenLijst = verzamelConstateringenMetBron();
  var idx = state._cGenLijst.findIndex(function(x){ return x.origineel === item; });
  return idx >= 0 ? idx + 1 : null;
}

function allConstateringen() {
  var res = [];
  if (state.type !== "scope12" && state.type !== "nen1010") state.items.forEach(function(it){ res.push(it); });
  state.constateringen.forEach(function(c){ res.push(c); });
  state.verdelers.forEach(function(v){ res.push(v); (v.zsMetingen||[]).forEach(function(m){ res.push(m); }); (v.ziMetingen||[]).forEach(function(m){ res.push(m); }); (v.risoMetingen||[]).forEach(function(m){ res.push(m); }); (v.rloMetingen||[]).forEach(function(m){ res.push(m); }); });
  state.omvormers.forEach(function(o){ res.push(o); o.strengen.forEach(function(s){ res.push(s); }); (o.rloMetingen||[]).forEach(function(m){ res.push(m); }); (o.zsMetingen||[]).forEach(function(m){ res.push(m); }); (o.ziMetingen||[]).forEach(function(m){ res.push(m); }); (o.risoMetingen||[]).forEach(function(m){ res.push(m); }); });
  if (state.type === "scope12") {
    (state.object.documentatie||[]).forEach(function(d){ if (d.beschikbaarheid === "Niet beschikbaar") res.push({ classificatie: d.classificatie || "gering" }); });
  }
  return res;
}

  var afwijkend = counts.opmerking + counts.gering + counts.serieus + counts.ernstig;

function stdMetingTabel(titel, lijst, toonKortsluitstroom) {

  var h = '<div class="doc-sub" style="margin-top:8px;">' + titel + '</div>';
  h += '<table class="std-table meet-table"><thead><tr><th style="width:' + wCircuit + ';">Circuit</th><th style="width:' + wWaarde + ';text-align:right;">Waarde</th>' + (toonKortsluitstroom ? '<th style="width:' + wIk + ';text-align:right;">I&#8342; (A)</th>' : '') + '<th style="width:' + wClass + ';text-align:center;">Classificatie</th></tr></thead><tbody>';
  lijst.forEach(function(m){
    h += '<tr><td style="width:' + wCircuit + ';">' + esc(m.circuit||"—") + '</td><td style="width:' + wWaarde + ';text-align:right;">' + esc(m.waarde||"—") + '</td>' + (toonKortsluitstroom ? '<td style="width:' + wIk + ';text-align:right;">' + (m.kortsluitstroom ? esc(m.kortsluitstroom) : "—") + '</td>' : '') + '<td style="width:' + wClass + ';text-align:center;">' + beoordelingBadge(m.classificatie) + '</td></tr>';
  });
  h += '</tbody></table>';

function normalizeMeting(m) { m.fotos = m.fotos || []; m.circuit = m.circuit || ""; m.waarde = m.waarde || ""; m.classificatie = m.classificatie || "goed"; m.opmerking = m.opmerking || ""; m.norm = m.norm || ""; return m; }
